display_information:
  name: mllab-gpu
  description: mllab 노드 GPU 사용 현황
  background_color: "#1f2937"
features:
  bot_user:
    display_name: mllab-gpu
    always_online: true
  slash_commands:
    - command: /gpu
      description: mllab GPU 사용 현황 (free | node 72 | user eklee)
      usage_hint: "[free | node 72 | user eklee]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - app_mentions:read
      - chat:write
      - chat:write.public
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
